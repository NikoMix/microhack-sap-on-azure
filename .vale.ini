# Vale prose linter — runs as informational quality telemetry (warnings only, non-blocking in CI).
# Styles are fetched with `vale sync` (see CI). Packages are open-source (MIT / CC-BY).
StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = SAPAzure
Packages = Microsoft, write-good

# Treat MDX as Markdown so Starlight content is linted.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, write-good

# Microsoft style rules that fight technical courseware — relax to keep signal high.
Microsoft.Contractions = NO
Microsoft.FirstPerson = NO
Microsoft.Adverbs = NO
Microsoft.We = warning

# Ignore MDX/JSX components, expressions, and frontmatter-ish tokens so they don't create noise.
BlockIgnores = (?s) *(<[A-Z][A-Za-z0-9]*(?: [^>]*)?>.*?</[A-Z][A-Za-z0-9]*>), \
               (?s)^import .*$, \
               (?s)^export .*$
TokenIgnores = (\{[^{}]*\}), (</?[A-Za-z][A-Za-z0-9.]*(?: [^>]*)?/?>)
