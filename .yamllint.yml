---
# yamllint configuration — https://yamllint.readthedocs.io
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    allowed-values: ['true', 'false', 'on'] # GitHub Actions uses `on:`
    check-keys: true
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  node_modules/
  dist/
  .astro/
  .venv/
