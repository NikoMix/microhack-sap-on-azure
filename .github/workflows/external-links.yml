name: External link check

# Weekly verification of outbound links in courseware + docs. Kept separate from CI so
# transient network/rate-limit failures never block a PR; failures open a tracking issue.
on:
  schedule:
    - cron: '13 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: Lychee link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --accept 200,206,429
            --exclude-mail
            "**/*.md"
            "**/*.mdx"
          fail: false
      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 'Broken external links detected'
          content-filepath: ./lychee/out.md
          labels: automated, links
