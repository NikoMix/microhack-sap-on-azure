name: Copilot setup steps

# Prepares the GitHub Copilot coding agent environment so it can build, lint, and validate
# this repo out of the box. The job MUST be named `copilot-setup-steps`.
on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Bicep CLI
        run: az bicep install
      - name: Warm the build
        run: npm run build
