name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site · build, lint, type-check, audit, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Markdown + format lint
        run: npm run lint
      - name: Astro type-check
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Validate internal links & base path
        run: npm run check:links
      - name: Security audit (fail on moderate+)
        run: npm audit --audit-level=moderate
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  bicep:
    name: Infra · Bicep build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bicep CLI
        run: az bicep install
      - name: Build & lint Bicep templates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          status=0
          templates=(infra/**/*.bicep)
          if [ ${#templates[@]} -eq 0 ]; then
            echo "No Bicep templates found." && exit 0
          fi
          for f in "${templates[@]}"; do
            echo "::group::az bicep build $f"
            az bicep build --file "$f" --stdout > /dev/null || status=1
            echo "::endgroup::"
          done
          for p in infra/**/*.bicepparam; do
            echo "::group::az bicep build-params $p"
            az bicep build-params --file "$p" --stdout > /dev/null || status=1
            echo "::endgroup::"
          done
          exit $status

  prose:
    name: Docs · prose quality (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Vale prose lint
        uses: errata-ai/vale-action@v2
        with:
          files: site/src/content
          fail_on_error: false
          reporter: github-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: Security · secret scan
    runs-on: ubuntu-latest
    env:
      # gitleaks is MIT-licensed; we run the binary directly to stay license-free.
      GITLEAKS_VERSION: '8.21.2'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repository for secrets
        run: gitleaks dir . --no-banner --redact --verbose
