# Keep every dependency current and vulnerability-free (grouped to reduce PR noise).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - automated
    groups:
      astro-starlight:
        patterns:
          - astro
          - '@astrojs/*'
      dev-tooling:
        patterns:
          - '*'
        exclude-patterns:
          - astro
          - '@astrojs/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - devcontainer
